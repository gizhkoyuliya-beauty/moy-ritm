<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#F3EBDD">
<title>Мой ритм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap">
<style>
  :root{
    --ivory:#F3EBDD;
    --paper:#FBF7F0;
    --line:#E6D9C4;
    --gold:#B08A4A;
    --gold-soft:#E9DCC3;
    --caramel:#A86F3D;
    --wine:#6E2E3A;
    --emerald:#315C4F;
    --emerald-soft:#DCE6E0;
    --rose:#C9A19A;
    --rose-soft:#F1E1DC;
    --graphite:#3E3935;
    --muted:#8A7F75;
    --radius:20px;
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ivory);color:var(--graphite);font-family:var(--sans);font-size:15px;line-height:1.35}
  body{min-height:100vh;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .app{max-width:480px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}

  /* ---------- Шапка ---------- */
  .hero{position:relative;margin:-16px -16px 0;aspect-ratio:1/1;max-height:72vh;width:calc(100% + 32px);overflow:hidden;background:linear-gradient(160deg,#4A2A2F,var(--wine) 55%,#8A5A3A)}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,rgba(243,235,221,0),var(--ivory));pointer-events:none}
  .hero.nophoto{aspect-ratio:auto;min-height:170px}
  .hero.nophoto::after{display:none}
  .hero-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 18px 0;z-index:1}
  .hello{min-width:0;max-width:60%}
  .hello h1{margin:0;font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.05;color:#FBF4E6;letter-spacing:.2px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
  .hello .date{margin-top:6px;color:rgba(251,244,230,.82);font-size:13.5px;text-transform:lowercase;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .streak{flex:none;text-align:center;background:rgba(251,247,240,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(251,247,240,.35);border-radius:16px;padding:8px 11px 7px;min-width:62px;color:#FBF4E6}
  .streak b{display:block;font-family:var(--serif);font-size:26px;line-height:1;color:#F2D9A6}
  .streak span{font-size:10.5px;color:rgba(251,244,230,.85);text-transform:uppercase;letter-spacing:.6px}
  .hero + .view .daybar{position:relative;margin-top:-34px;z-index:2;box-shadow:0 10px 26px rgba(62,57,53,.10)}
  .daybar{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .daybar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .daybar-top .t{font-size:13.5px;color:var(--muted)}
  .daybar-top .n{font-family:var(--serif);font-size:21px;color:var(--graphite)}
  .daybar-top .n small{font-size:15px;color:var(--muted)}
  .bar{height:8px;border-radius:8px;background:var(--gold-soft);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--caramel));transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .bar.done i{background:linear-gradient(90deg,#4C7C6D,var(--emerald))}

  /* ---------- Секции ---------- */
  .sec{margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
  .sec h2{margin:0;font-family:var(--serif);font-weight:600;font-size:21px;color:var(--wine)}
  .sec .aside{font-size:12.5px;color:var(--muted)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}

  /* ---------- Вода ---------- */
  .water{padding:16px}
  .water-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .water-l{font-family:var(--serif);font-size:30px;line-height:1;color:var(--graphite)}
  .water-l small{font-size:16px;color:var(--muted);margin-left:2px}
  .water-goal{font-size:12.5px;color:var(--muted);margin-top:4px}
  .btn-add{display:flex;align-items:center;gap:6px;background:var(--emerald);color:#fff;border-radius:14px;padding:11px 15px;font-weight:600;font-size:14.5px;box-shadow:0 6px 14px rgba(49,92,79,.25);transition:transform .12s}
  .btn-add:active{transform:scale(.95)}
  .btn-minus{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-size:20px;margin-right:8px}
  .drops{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;position:relative}
  .drop{height:42px;display:flex;align-items:center;justify-content:center}
  .drop svg{width:24px;height:30px;transition:transform .2s}
  .drop svg path{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.2;transition:fill .25s}
  .drop.on svg path{fill:#7FA9B8;stroke:#5E8C9C}
  .drop.on.min svg path{fill:#6E9BAB}
  .drop:active svg{transform:scale(.85)}
  .water-scale{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:2px;font-size:10.5px;color:var(--muted);text-align:center}
  .water-scale .mark{color:var(--caramel);font-weight:600}

  /* ---------- Приёмы ---------- */
  .intake{display:flex;flex-direction:column;margin-bottom:10px;overflow:hidden;transition:background .3s,border-color .3s}
  .intake.done{background:var(--emerald-soft);border-color:#B9CEC5}
  .intake-row{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;text-align:left;width:100%}
  .intake-ico{flex:none;width:42px;height:42px;border-radius:14px;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;font-size:20px}
  .intake.done .intake-ico{background:#C9DAD2}
  .intake-txt{flex:1;min-width:0}
  .intake-txt b{display:block;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.1;color:var(--graphite)}
  .intake-txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .check{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;transition:all .25s}
  .check svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:all .25s}
  .check.part{border-color:var(--caramel);background:var(--gold-soft)}
  .check.part .cnt{font-size:12px;font-weight:700;color:var(--caramel)}
  .check.on{background:var(--emerald);border-color:var(--emerald)}
  .check.on svg{opacity:1;transform:scale(1)}
  .expand{flex:none;width:30px;height:40px;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .25s}
  .intake.open .expand{transform:rotate(180deg)}
  .items{display:none;padding:0 14px 12px 16px;border-top:1px dashed var(--line)}
  .intake.done .items{border-top-color:#B9CEC5}
  .intake.open .items{display:block}
  .item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 2px;border-bottom:1px solid rgba(0,0,0,.04);text-align:left}
  .item:last-child{border-bottom:0}
  .mini{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center}
  .mini svg{width:13px;height:13px;opacity:0}
  .item.on .mini{background:var(--emerald);border-color:var(--emerald)}
  .item.on .mini svg{opacity:1}
  .single .intake-row{padding:12px 14px 12px 16px}
  .single .intake-ico{width:36px;height:36px;border-radius:12px;font-size:17px}
  .single .check{width:34px;height:34px}

  /* ---------- Неделя ---------- */
  .week{padding:6px 16px}
  .wk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .wk:last-child{border-bottom:0}
  .wk-ico{font-size:20px;width:26px;text-align:center}
  .wk-txt{flex:1;min-width:0}
  .wk-txt b{display:block;font-weight:600;font-size:15px}
  .wk-dots{display:flex;gap:5px;margin-top:5px;align-items:center}
  .wk-dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold);display:block}
  .wk-dots i.on{background:var(--emerald);border-color:var(--emerald)}
  .wk-dots em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:6px}
  .wk.goal .wk-dots em{color:var(--emerald);font-weight:600}
  .wk-btn{flex:none;min-width:44px;height:38px;padding:0 12px;border-radius:12px;border:1.5px solid var(--gold);color:var(--caramel);font-size:20px;font-weight:500;transition:all .2s}
  .wk-btn.today{background:var(--emerald);border-color:var(--emerald);color:#fff;font-size:12.5px;font-weight:600}
  .wk-btn:active{transform:scale(.94)}

  /* ---------- Самочувствие ---------- */
  .well{padding:6px 16px}
  .wl{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .wl:last-child{border-bottom:0}
  .wl b{font-weight:500;font-size:14.5px}
  .scale{display:flex;gap:6px}
  .scale button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--rose);color:var(--muted);font-size:13px;font-weight:600;transition:all .2s}
  .scale button.on{background:var(--rose);color:#fff;border-color:var(--rose)}
  .scale button.top{background:var(--wine);border-color:var(--wine);color:#fff}

  /* ---------- Календарь ---------- */
  .cal{padding:14px 12px 10px}
  .cal-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px}
  .cal-head h3{margin:0;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--wine);text-transform:capitalize}
  .cal-nav{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);color:var(--caramel);font-size:18px}
  .cal-nav:disabled{opacity:.3}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .wd{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-bottom:4px}
  .cell{aspect-ratio:1/1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-size:13.5px}
  .cell .c{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);color:var(--muted)}
  .cell.full .c{background:var(--emerald);border:0;color:#fff;font-weight:600}
  .cell.part .c{background:var(--gold-soft);border:1.5px solid var(--gold);color:var(--caramel);font-weight:600}
  .cell.future .c{border-color:transparent;color:#C8BDB0}
  .cell.today .c{box-shadow:0 0 0 2px var(--ivory),0 0 0 3.5px var(--wine)}
  .cell.sel{background:var(--rose-soft)}
  .cell .dots{display:flex;gap:2px;height:5px}
  .cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--wine)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);padding:12px 0 2px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1;color:var(--caramel)}
  .stat span{font-size:11.5px;color:var(--muted)}
  .detail{margin-top:12px;padding:14px 16px}
  .detail h4{margin:0 0 8px;font-family:var(--serif);font-size:19px;color:var(--wine);font-weight:600}
  .detail p{margin:5px 0;font-size:14px;display:flex;justify-content:space-between;gap:10px}
  .detail p span:first-child{color:var(--muted)}

  /* ---------- Навигация ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(243,235,221,0),var(--ivory) 30%)}
  .tabs-in{max-width:448px;margin:0 auto;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:4px;box-shadow:0 8px 24px rgba(62,57,53,.08)}
  .tab{flex:1;padding:11px 0;border-radius:14px;font-weight:600;font-size:14px;color:var(--muted);transition:all .2s}
  .tab.on{background:var(--wine);color:#fff}
  .view{display:none;animation:fade .3s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- Тост ---------- */
  .toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-220%);opacity:0;visibility:hidden;background:var(--emerald);color:#fff;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;box-shadow:0 10px 28px rgba(49,92,79,.3);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s,visibility .3s;z-index:20;white-space:nowrap}
  .toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

  /* ---------- Загрузка и заглушка ---------- */
  .state{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .state .orn{font-family:var(--serif);font-size:44px;color:var(--gold);line-height:1}
  .state h2{font-family:var(--serif);font-size:26px;color:var(--wine);margin:14px 0 6px;font-weight:600}
  .state p{color:var(--muted);margin:0 0 20px;max-width:280px}
  .state .btn-add{margin:0 auto}
  .pulse{width:46px;height:46px;border-radius:50%;border:3px solid var(--gold-soft);border-top-color:var(--gold);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .demo-note{margin:18px 4px 0;font-size:11.5px;color:var(--muted);text-align:center}

  /* ================= Премиальная отделка ================= */
  .card{background:linear-gradient(180deg,#FDFAF5,#F8F1E6);border:1px solid rgba(176,138,74,.28);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 14px 30px -20px rgba(110,46,58,.35)}
  .sec{margin:30px 4px 12px;align-items:center;gap:14px}
  .sec h2{flex:1;display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold)}
  .sec h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(176,138,74,.55),rgba(176,138,74,0))}
  .sec .aside{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted)}

  .daybar{background:linear-gradient(180deg,#FDFAF5,#F8F1E6);border:1px solid rgba(176,138,74,.3);border-radius:22px;padding:16px 18px 18px}
  .daybar-top .t{font-size:10.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold)}
  .daybar-top .n{font-size:26px;font-weight:500}
  .daybar-top .n small{font-style:italic}
  .bar{height:3px;background:rgba(176,138,74,.18)}
  .bar i{background:linear-gradient(90deg,#D9BE85,var(--gold),var(--caramel))}

  .water{padding:18px}
  .water-l{font-size:42px;font-weight:500}
  .water-goal{font-family:var(--serif);font-style:italic;font-size:15.5px}
  .btn-add{background:var(--emerald);color:#F2DDA9;border-radius:999px;padding:12px 18px;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;box-shadow:0 10px 20px -10px rgba(49,92,79,.7)}
  .btn-minus{border-radius:50%;border-color:rgba(176,138,74,.45);color:var(--gold)}
  .drop svg path{fill:rgba(176,138,74,.07);stroke:rgba(176,138,74,.75);stroke-width:1}
  .drop.on svg path,.drop.on.min svg path{fill:#86A8AE;stroke:#5F878F}
  .water-scale .mark{font-family:var(--serif);font-style:italic;font-size:13px;font-weight:500}

  .ico{width:22px;height:22px;display:block}
  .intake-ico{background:none;border:1px solid rgba(176,138,74,.5);border-radius:50%;color:var(--gold);transition:all .3s}
  .intake-txt b{font-size:23px;font-weight:600;letter-spacing:.2px}
  .intake-txt span{font-size:12px;letter-spacing:.2px}
  .intake.done{background:linear-gradient(180deg,#FDFAF5,#F3EDE1);border-color:rgba(49,92,79,.4)}
  .intake.done .intake-ico{background:var(--emerald);border-color:var(--emerald);color:#F2DDA9}
  .intake.done .items{border-top-color:rgba(49,92,79,.25)}
  .check{border:1px solid var(--gold);width:38px;height:38px}
  .check.part{background:transparent;border-color:var(--caramel)}
  .check.part .cnt{font-family:var(--serif);font-style:italic;font-size:14px;font-weight:600}
  .check.on{background:var(--emerald);border-color:var(--emerald);box-shadow:0 6px 14px -6px rgba(49,92,79,.7)}
  .items{border-top:1px solid rgba(176,138,74,.2)}
  .item span:first-child{font-family:var(--serif);font-size:18px}
  .mini{border-radius:50%;border:1px solid var(--gold)}
  .single .intake-ico{border-radius:50%}
  .single .check{width:34px;height:34px}

  .wk{border-bottom-color:rgba(176,138,74,.2)}
  .wk-ico{color:var(--gold);width:40px;height:40px;border:1px solid rgba(176,138,74,.45);border-radius:50%;display:flex;align-items:center;justify-content:center}
  .wk-ico .ico{width:20px;height:20px}
  .wk.goal .wk-ico{background:var(--emerald);border-color:var(--emerald);color:#F2DDA9}
  .wk-txt b{font-family:var(--serif);font-size:20px;font-weight:600}
  .wk-dots i{width:9px;height:9px;border-width:1px}
  .wk-dots em{font-family:var(--serif);font-style:italic;font-size:14.5px}
  .wk-btn{border-radius:999px;border:1px solid var(--gold);color:var(--gold);font-size:22px;font-weight:300;min-width:42px;height:42px}
  .wk-btn.today{background:var(--emerald);border-color:var(--emerald);color:#F2DDA9;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:0 14px}

  .cal-head h3{font-size:26px;font-weight:500}
  .cal-nav{border-radius:50%;border-color:rgba(176,138,74,.45);color:var(--gold)}
  .wd{letter-spacing:1.4px;color:var(--gold);font-size:10px}
  .cell .c{border:1px dashed rgba(176,138,74,.35);font-variant-numeric:tabular-nums}
  .cell.part .c{background:rgba(176,138,74,.12);border:1px solid var(--gold)}
  .stat{background:linear-gradient(180deg,#FDFAF5,#F8F1E6);border:1px solid rgba(176,138,74,.28);border-radius:20px}
  .stat b{font-size:32px;font-weight:500}
  .detail h4{font-size:22px;font-weight:600}

  .tabs-in{background:rgba(253,250,245,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(176,138,74,.3);border-radius:999px;padding:5px}
  .tab{border-radius:999px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase}
  .tab.on{background:var(--wine);color:#F2DDA9}
  .toast{background:var(--wine);color:#F2DDA9;border-radius:999px;font-weight:500;letter-spacing:.3px}
  .demo-note{font-family:var(--serif);font-style:italic;font-size:13.5px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="state"><div class="pulse"></div><p style="margin-top:16px">Загружаю твой день…</p></div>
</div>
<div class="toast" id="toast"></div>

<!-- Резервная копия data.json: используется, только если data.json не загрузился -->

<script>
(function(){
  "use strict";

  /* ================= Telegram ================= */
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    try { tg.setHeaderColor('#F3EBDD'); tg.setBackgroundColor('#F3EBDD'); } catch(e){}
  }
  function haptic(type){
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(type || 'light');
    } catch(e){}
  }

  /* ================= Даты ================= */
  var MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function addDays(d,n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function pad(n){ return (n<10?'0':'')+n; }
  function keyOf(d){ return 'd'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
  function mondayOf(d){ var x = startOfDay(d); var wd = (x.getDay()+6)%7; return addDays(x,-wd); }

  /* ================= Хранилище ================= */
  // Отметки хранятся в облаке Telegram (CloudStorage) — синхронизируются между устройствами.
  // Вне Telegram (для теста в браузере) — в localStorage.
  var hasCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));

  function localGet(k){ try { return localStorage.getItem('ritm_'+k); } catch(e){ return null; } }
  function localSet(k,v){ try { localStorage.setItem('ritm_'+k, v); } catch(e){} }

  function loadKeys(keys){
    return new Promise(function(resolve){
      var out = {};
      if (!hasCloud) {
        keys.forEach(function(k){ var v = localGet(k); if (v) out[k] = v; });
        return resolve(out);
      }
      var chunks = [];
      for (var i=0;i<keys.length;i+=25) chunks.push(keys.slice(i,i+25));
      var left = chunks.length;
      if (!left) return resolve(out);
      chunks.forEach(function(ch){
        try {
          tg.CloudStorage.getItems(ch, function(err, res){
            if (!err && res) Object.keys(res).forEach(function(k){ if (res[k]) out[k] = res[k]; });
            else ch.forEach(function(k){ var v = localGet(k); if (v) out[k] = v; });
            if (--left === 0) resolve(out);
          });
        } catch(e){
          ch.forEach(function(k){ var v = localGet(k); if (v) out[k] = v; });
          if (--left === 0) resolve(out);
        }
      });
    });
  }
  var saveTimer = null;
  function saveDay(k){
    var v = JSON.stringify(days[k]);
    localSet(k, v);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      if (hasCloud) { try { tg.CloudStorage.setItem(k, v, function(){}); } catch(e){} }
    }, 350);
  }

  /* ================= Состояние ================= */
  var cfg = null;           // содержимое data.json
  var days = {};            // { dYYYYMMDD: {...} }
  var demoKeys = {};        // дни, взятые из примеров
  var today = startOfDay(new Date());
  var tab = 'today';
  var openIntake = {};
  var calMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  var selKey = null;
  var wasComplete = false;

  function emptyDay(){ return { water:0, intakes:{}, daily:[], weekly:[], wellbeing:{} }; }
  function getDay(k){ return days[k] || emptyDay(); }
  function todayKey(){ return keyOf(today); }
  function editToday(){
    var k = todayKey();
    if (!days[k] || demoKeys[k]) { days[k] = days[k] ? JSON.parse(JSON.stringify(days[k])) : emptyDay(); delete demoKeys[k]; }
    return days[k];
  }

  /* ================= Логика дня ================= */
  function minGlasses(){ return Math.ceil(cfg.water.goalMinMl / cfg.water.glassMl); }
  function maxGlasses(){ return Math.round(cfg.water.goalMaxMl / cfg.water.glassMl); }
  function intakeDone(day, it){ var l = day.intakes[it.id] || []; return it.items.filter(function(x){ return l.indexOf(x.id) > -1; }).length; }

  function dayStats(day){
    var total = 1, done = (day.water >= minGlasses()) ? 1 : 0;
    cfg.intakes.forEach(function(it){ total += it.items.length; done += intakeDone(day,it); });
    cfg.daily.forEach(function(d){ total += 1; if (day.daily.indexOf(d.id) > -1) done += 1; });
    var touched = day.water > 0 || done > 0 || (day.weekly||[]).length > 0;
    return { total: total, done: done, complete: done === total, touched: touched };
  }
  function streak(){
    var d = today, n = 0;
    if (!dayStats(getDay(keyOf(d))).complete) d = addDays(d,-1);
    for (var i=0;i<400;i++){
      var k = keyOf(d);
      if (!days[k] || !dayStats(days[k]).complete) break;
      n++; d = addDays(d,-1);
    }
    return n;
  }
  function weekCount(id){
    var m = mondayOf(today), c = 0;
    for (var i=0;i<7;i++){ var dd = getDay(keyOf(addDays(m,i))); if ((dd.weekly||[]).indexOf(id) > -1) c++; }
    return c;
  }
  function plural(n, one, few, many){
    var a = n%10, b = n%100;
    if (a===1 && b!==11) return one;
    if (a>=2 && a<=4 && (b<10 || b>=20)) return few;
    return many;
  }
  function litres(gl){ var l = gl*cfg.water.glassMl/1000; return (Math.round(l*100)/100).toString().replace('.',','); }

  /* ================= Иконки ================= */
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#F2DDA9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_DROP = '<svg viewBox="0 0 24 30"><path d="M12 1.5C12 1.5 3 12.2 3 18.6A9 9 0 0 0 21 18.6C21 12.2 12 1.5 12 1.5Z"/></svg>';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var ICONS = {
    sunrise:'<path d="M3 18h18M6.5 18a5.5 5.5 0 0 1 11 0M12 6v3M5.3 10.3l1.6 1.2M18.7 10.3l-1.6 1.2M8 21.5h8"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
    moon:'<path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>',
    spark:'<path d="M12 3c.6 4.4 2.6 6.4 7 7-4.4.6-6.4 2.6-7 7-.6-4.4-2.6-6.4-7-7 4.4-.6 6.4-2.6 7-7z"/><path d="M18.5 16.5c.2 1.4.8 2 2.2 2.2-1.4.2-2 .8-2.2 2.2-.2-1.4-.8-2-2.2-2.2 1.4-.2 2-.8 2.2-2.2z"/>',
    sport:'<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
    face:'<path d="M12 20.5c-4.3 0-7.5-3-7.5-7.3 3.3 0 6 1.7 7.5 4.3 1.5-2.6 4.2-4.3 7.5-4.3 0 4.3-3.2 7.3-7.5 7.3z"/><path d="M12 17.5c-1.7-2.7-1.7-6.5 0-11 1.7 4.5 1.7 8.3 0 11z"/>',
    massage:'<path d="M3.5 9c2.1-2 4.2-2 6.3 0s4.2 2 6.3 0 3.2-1.4 4.4-1.2M3.5 15c2.1-2 4.2-2 6.3 0s4.2 2 6.3 0 3.2-1.4 4.4-1.2"/>'
  };
  function icon(k){ return ICONS[k] ? '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg>' : esc(k||''); }

  /* ================= Рендер ================= */
  var $app = document.getElementById('app');

  function greeting(){
    var h = new Date().getHours();
    if (h>=5 && h<12) return 'Доброе утро';
    if (h>=12 && h<17) return 'Добрый день';
    if (h>=17 && h<23) return 'Добрый вечер';
    return 'Доброй ночи';
  }

  function render(){
    var name = cfg.user && cfg.user.name ? cfg.user.name : '';
    var photo = cfg.user && cfg.user.photo ? cfg.user.photo : '';
    var s = streak();

    var html = '';
    html += '<header class="hero'+(photo?'':' nophoto')+'" id="hero">'
          + (photo ? '<img src="'+esc(photo)+'" alt="'+esc(name)+'" onerror="photoFail(this)">' : '')
          + '<div class="hero-top"><div class="hello"><h1>'+greeting()+(name?',<br>'+esc(name):'')+'</h1>'
          + '<div class="date">'+WEEKDAYS[today.getDay()]+', '+today.getDate()+' '+MONTHS_GEN[today.getMonth()]+'</div></div>'
          + '<div class="streak"><b>'+s+'</b><span>🔥 '+plural(s,'день','дня','дней')+'</span></div></div>'
          + '</header>';

    html += '<main class="view'+(tab==='today'?' on':'')+'" id="v-today">'+renderToday()+'</main>';
    html += '<main class="view'+(tab==='cal'?' on':'')+'" id="v-cal">'+renderCalendar()+'</main>';
    if (cfg.demo && cfg.demo.enabled) html += '<div class="demo-note">Прошлые дни заполнены примерами из data.json</div>';
    $app.innerHTML = html;

    if (!document.getElementById('tabs')) {
      var nav = document.createElement('nav');
      nav.className = 'tabs'; nav.id = 'tabs';
      nav.innerHTML = '<div class="tabs-in"><button class="tab" data-tab="today">Сегодня</button><button class="tab" data-tab="cal">Календарь</button></div>';
      document.body.appendChild(nav);
    }
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.classList.toggle('on', b.getAttribute('data-tab')===tab); });
  }

  function renderToday(){
    var day = getDay(todayKey());
    var st = dayStats(day);
    var pct = Math.round(st.done/st.total*100);
    var h = '';

    h += '<div class="daybar"><div class="daybar-top"><span class="t">'+(st.complete?'День засчитан ✨':'Прогресс дня')+'</span>'
       + '<span class="n">'+st.done+' <small>из '+st.total+'</small></span></div>'
       + '<div class="bar'+(st.complete?' done':'')+'"><i style="width:'+pct+'%"></i></div></div>';

    // ---- Вода
    var mx = maxGlasses(), mn = minGlasses();
    h += '<div class="sec"><h2>Вода</h2><span class="aside">стакан = '+cfg.water.glassMl+' мл</span></div>';
    h += '<div class="card water"><div class="water-head"><div>'
       + '<div class="water-l">'+litres(day.water)+'<small> л</small></div>'
       + '<div class="water-goal">'+(day.water>=mx?'Идеально — 2 л выпито 💧':(day.water>=mn?'Норма есть, до идеала '+(mx-day.water)+' '+plural(mx-day.water,'стакан','стакана','стаканов'):'До нормы '+(mn-day.water)+' '+plural(mn-day.water,'стакан','стакана','стаканов')))+'</div>'
       + '</div><div style="display:flex;align-items:center">'
       + (day.water>0?'<button class="btn-minus" data-act="water-minus" aria-label="Убрать стакан">−</button>':'')
       + '<button class="btn-add" data-act="water-plus">+ Стакан</button></div></div>';
    h += '<div class="drops">';
    for (var i=0;i<mx;i++) h += '<button class="drop'+(i<day.water?' on':'')+(i<mn?' min':'')+'" data-act="water-set" data-n="'+(i+1)+'" aria-label="'+(i+1)+' стакан">'+ICON_DROP+'</button>';
    h += '</div><div class="water-scale">';
    for (var j=0;j<mx;j++){
      var lbl = '';
      if (j+1===mn) lbl = '<span class="mark">'+litres(mn)+'</span>';
      else if (j+1===mx) lbl = '<span class="mark">'+litres(mx)+'</span>';
      h += '<div>'+lbl+'</div>';
    }
    h += '</div></div>';

    // ---- БАДы
    h += '<div class="sec"><h2>БАДы</h2><span class="aside">нажми на карточку — отмечу всё</span></div>';
    cfg.intakes.forEach(function(it){
      var d = intakeDone(day,it), n = it.items.length;
      var cls = d===n ? 'on' : (d>0 ? 'part' : '');
      var names = it.items.map(function(x){ return x.name; }).join(' · ');
      h += '<div class="card intake'+(d===n?' done':'')+(openIntake[it.id]?' open':'')+'">'
         + '<div style="display:flex;align-items:center">'
         + '<button class="intake-row" data-act="intake" data-id="'+it.id+'">'
         + '<span class="intake-ico">'+icon(it.icon)+'</span>'
         + '<span class="intake-txt"><b>'+esc(it.title)+'</b><span>'+esc(it.hint)+' · '+esc(names)+'</span></span>'
         + '<span class="check '+cls+'">'+(cls==='part'?'<span class="cnt">'+d+'/'+n+'</span>':ICON_CHECK)+'</span>'
         + '</button>'
         + '<button class="expand" data-act="expand" data-id="'+it.id+'" aria-label="Подробнее">▾</button>'
         + '</div><div class="items">';
      it.items.forEach(function(x){
        var on = (day.intakes[it.id]||[]).indexOf(x.id) > -1;
        h += '<button class="item'+(on?' on':'')+'" data-act="item" data-id="'+it.id+'" data-item="'+x.id+'"><span>'+esc(x.name)+'</span><span class="mini">'+ICON_CHECK+'</span></button>';
      });
      h += '</div></div>';
    });
    cfg.daily.forEach(function(dl){
      var on = day.daily.indexOf(dl.id) > -1;
      h += '<div class="card intake single'+(on?' done':'')+'"><button class="intake-row" data-act="daily" data-id="'+dl.id+'">'
         + '<span class="intake-ico">'+icon(dl.icon)+'</span>'
         + '<span class="intake-txt"><b>'+esc(dl.name)+'</b><span>'+esc(dl.hint)+'</span></span>'
         + '<span class="check'+(on?' on':'')+'">'+ICON_CHECK+'</span></button></div>';
    });

    // ---- Неделя
    var m = mondayOf(today), sunday = addDays(m,6);
    h += '<div class="sec"><h2>Неделя</h2><span class="aside">'+m.getDate()+' – '+sunday.getDate()+' '+MONTHS_GEN[sunday.getMonth()]+'</span></div>';
    h += '<div class="card week">';
    cfg.weekly.forEach(function(w){
      var c = weekCount(w.id), doneToday = (day.weekly||[]).indexOf(w.id) > -1;
      var dots = '';
      for (var i=0;i<Math.max(w.target,c);i++) dots += '<i class="'+(i<c?'on':'')+'"></i>';
      h += '<div class="wk'+(c>=w.target?' goal':'')+'"><span class="wk-ico">'+icon(w.icon)+'</span>'
         + '<div class="wk-txt"><b>'+esc(w.name)+'</b><div class="wk-dots">'+dots+'<em>'+(c>=w.target?'цель недели ✓':c+' из '+w.target)+'</em></div></div>'
         + '<button class="wk-btn'+(doneToday?' today':'')+'" data-act="weekly" data-id="'+w.id+'">'+(doneToday?'✓ сегодня':'+')+'</button></div>';
    });
    h += '</div>';

    return h;
  }

  function renderCalendar(){
    var y = calMonth.getFullYear(), mo = calMonth.getMonth();
    var first = new Date(y,mo,1), dim = new Date(y,mo+1,0).getDate();
    var lead = (first.getDay()+6)%7;
    var isCurMonth = (y===today.getFullYear() && mo===today.getMonth());
    var h = '<div class="card cal"><div class="cal-head">'
          + '<button class="cal-nav" data-act="cal-prev" aria-label="Предыдущий месяц">‹</button>'
          + '<h3>'+MONTHS[mo]+' '+y+'</h3>'
          + '<button class="cal-nav" data-act="cal-next" '+(isCurMonth?'disabled':'')+' aria-label="Следующий месяц">›</button></div>';
    h += '<div class="grid">';
    ['пн','вт','ср','чт','пт','сб','вс'].forEach(function(w){ h += '<div class="wd">'+w+'</div>'; });
    for (var i=0;i<lead;i++) h += '<div></div>';
    var full = 0, part = 0, passed = 0, actTotal = 0;
    for (var d=1; d<=dim; d++){
      var dt = new Date(y,mo,d), k = keyOf(dt);
      var future = dt > today;
      var day = days[k], cls = 'cell', dots = '';
      if (future) cls += ' future';
      else {
        passed++;
        if (day){
          var st = dayStats(day);
          if (st.complete){ cls += ' full'; full++; }
          else if (st.touched){ cls += ' part'; part++; }
          (day.weekly||[]).forEach(function(){ dots += '<i></i>'; actTotal++; });
        }
      }
      if (k===todayKey()) cls += ' today';
      if (k===selKey) cls += ' sel';
      h += '<button class="'+cls+'" '+(future?'disabled':'data-act="cal-day" data-k="'+k+'"')+'><span class="c">'+d+'</span><span class="dots">'+dots+'</span></button>';
    }
    h += '</div><div class="legend">'
       + '<span><i style="background:var(--emerald)"></i>всё выполнено</span>'
       + '<span><i style="background:var(--gold-soft);border:1.5px solid var(--gold)"></i>частично</span>'
       + '<span><i style="background:var(--wine);width:6px;height:6px"></i>спорт / лицо / массаж</span>'
       + '</div></div>';

    h += '<div class="stats">'
       + '<div class="stat"><b>'+full+'</b><span>полных '+plural(full,'день','дня','дней')+'</span></div>'
       + '<div class="stat"><b>'+part+'</b><span>частично</span></div>'
       + '<div class="stat"><b>'+actTotal+'</b><span>'+plural(actTotal,'занятие','занятия','занятий')+'</span></div>'
       + '</div>';

    if (selKey){
      var sd = getDay(selKey), ss = dayStats(sd);
      var dd = new Date(+selKey.slice(1,5), +selKey.slice(5,7)-1, +selKey.slice(7,9));
      var supTotal = 0, supDone = 0;
      cfg.intakes.forEach(function(it){ supTotal += it.items.length; supDone += intakeDone(sd,it); });
      var acts = (sd.weekly||[]).map(function(id){ var w = cfg.weekly.filter(function(x){return x.id===id;})[0]; return w ? w.name : id; });
      h += '<div class="card detail"><h4>'+dd.getDate()+' '+MONTHS_GEN[dd.getMonth()]+(ss.complete?' · засчитан ✨':'')+'</h4>'
         + '<p><span>Вода</span><span>'+litres(sd.water)+' л</span></p>'
         + '<p><span>БАДы</span><span>'+supDone+' из '+supTotal+'</span></p>'
         + cfg.daily.map(function(dl){ return '<p><span>'+esc(dl.name)+'</span><span>'+(sd.daily.indexOf(dl.id)>-1?'✓':'—')+'</span></p>'; }).join('')
         + '<p><span>Активность</span><span>'+(acts.length?esc(acts.join(', ')):'—')+'</span></p>'
         + '</div>';
    }
    return h;
  }

  /* ================= Действия ================= */
  var toastTimer = null;
  function toast(t){
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }

  function afterChange(){
    var k = todayKey();
    saveDay(k);
    var st = dayStats(days[k]);
    if (st.complete && !wasComplete){
      haptic('success');
      var s = streak();
      setTimeout(function(){ toast('День засчитан ✨ Серия: '+s+' '+plural(s,'день','дня','дней')); }, 150);
    }
    wasComplete = st.complete;
    var y = window.scrollY;
    render();
    window.scrollTo(0,y);
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act],[data-tab]');
    if (!t || !cfg) return;
    if (t.hasAttribute('data-tab')){
      tab = t.getAttribute('data-tab'); haptic('light'); render(); window.scrollTo(0,0); return;
    }
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id'), day;
    switch(act){
      case 'water-plus':
        day = editToday(); if (day.water < maxGlasses()+4) day.water++; haptic('light'); afterChange(); break;
      case 'water-minus':
        day = editToday(); if (day.water>0) day.water--; haptic('light'); afterChange(); break;
      case 'water-set':
        day = editToday(); var n = +t.getAttribute('data-n');
        day.water = (day.water===n) ? n-1 : n; haptic('light'); afterChange(); break;
      case 'intake':
        day = editToday();
        var it = cfg.intakes.filter(function(x){ return x.id===id; })[0];
        var all = intakeDone(day,it) === it.items.length;
        day.intakes[id] = all ? [] : it.items.map(function(x){ return x.id; });
        haptic(all ? 'light' : 'medium'); afterChange(); break;
      case 'item':
        day = editToday(); var iid = t.getAttribute('data-item');
        var l = day.intakes[id] || (day.intakes[id] = []);
        var p = l.indexOf(iid); if (p>-1) l.splice(p,1); else l.push(iid);
        haptic('light'); afterChange(); break;
      case 'expand':
        openIntake[id] = !openIntake[id]; haptic('light'); var y0 = window.scrollY; render(); window.scrollTo(0,y0); break;
      case 'daily':
        day = editToday(); var q = day.daily.indexOf(id);
        if (q>-1) day.daily.splice(q,1); else day.daily.push(id);
        haptic('medium'); afterChange(); break;
      case 'weekly':
        day = editToday(); day.weekly = day.weekly || [];
        var r = day.weekly.indexOf(id);
        if (r>-1) day.weekly.splice(r,1);
        else {
          day.weekly.push(id);
          var w = cfg.weekly.filter(function(x){ return x.id===id; })[0];
          if (weekCount(id) === w.target) setTimeout(function(){ toast(w.name+': цель недели выполнена'); }, 150);
        }
        haptic('medium'); afterChange(); break;
      case 'well':
        day = editToday(); day.wellbeing = day.wellbeing || {};
        var v = +t.getAttribute('data-v');
        day.wellbeing[id] = (day.wellbeing[id]===v) ? 0 : v;
        haptic('light'); afterChange(); break;
      case 'cal-prev':
        calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); selKey = null;
        ensureMonthLoaded().then(render); break;
      case 'cal-next':
        calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); selKey = null;
        ensureMonthLoaded().then(render); break;
      case 'cal-day':
        var k = t.getAttribute('data-k'); selKey = (selKey===k) ? null : k; haptic('light');
        var y1 = window.scrollY; render(); window.scrollTo(0,y1); break;
    }
  });

  /* ================= Загрузка ================= */
  var loadedFrom = null;
  function rangeKeys(from, to){ var ks = [], d = startOfDay(from); while (d <= to){ ks.push(keyOf(d)); d = addDays(d,1); } return ks; }
  function ingest(res){
    Object.keys(res).forEach(function(k){
      try { var v = JSON.parse(res[k]); if (v && typeof v === 'object') { days[k] = Object.assign(emptyDay(), v); delete demoKeys[k]; } } catch(e){}
    });
  }
  function ensureMonthLoaded(){
    var first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    if (loadedFrom && first >= loadedFrom) return Promise.resolve();
    var to = loadedFrom ? addDays(loadedFrom,-1) : today;
    var ks = rangeKeys(first, to);
    loadedFrom = first;
    return loadKeys(ks).then(ingest);
  }

  function applyDemo(){
    if (!cfg.demo || !cfg.demo.enabled || !Array.isArray(cfg.demo.days)) return;
    cfg.demo.days.forEach(function(dd){
      var k = keyOf(addDays(today, -(dd.daysAgo||0)));
      if (days[k]) return; // реальные отметки важнее примеров
      days[k] = { water: dd.water||0, intakes: dd.intakes||{}, daily: dd.daily||[], weekly: dd.weekly||[], wellbeing: dd.wellbeing||{} };
      demoKeys[k] = true;
    });
  }

  function showError(){
    $app.innerHTML = '<div class="state"><div class="orn">❦</div><h2>Не получилось загрузить данные</h2>'
      + '<p>Файл с привычками сейчас недоступен. Проверь интернет и попробуй ещё раз — твои отметки никуда не делись.</p>'
      + '<button class="btn-add" id="retry">Попробовать снова</button></div>';
    document.getElementById('retry').onclick = function(){
      $app.innerHTML = '<div class="state"><div class="pulse"></div><p style="margin-top:16px">Загружаю твой день…</p></div>';
      start();
    };
  }

  function validCfg(c){
    return c && c.water && Array.isArray(c.intakes) && Array.isArray(c.daily) && Array.isArray(c.weekly);
  }

  function embedded(){
    try { var el = document.getElementById('fallback-data'); return el ? JSON.parse(el.textContent) : null; } catch(e){ return null; }
  }
  function boot(c){
    cfg = c;
    var from = addDays(today, -120);
    loadedFrom = new Date(from.getFullYear(), from.getMonth(), 1);
    return loadKeys(rangeKeys(loadedFrom, today)).then(function(res){
      ingest(res);
      applyDemo();
      wasComplete = dayStats(getDay(todayKey())).complete;
      try { render(); }
      catch(err){
        $app.innerHTML = '<div class="state"><div class="orn">❦</div><h2>Что-то пошло не так</h2><p>Экран не смог отрисоваться. Пришли мне этот текст: '+esc(err && err.message || err)+'</p></div>';
      }
    });
  }
  function start(){
    fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(c){ if (!validCfg(c)) throw new Error('bad data'); return c; })
      .catch(function(){
        // data.json недоступен (например, файл открыт без хостинга) — берём встроенную копию
        var c = embedded();
        return validCfg(c) ? c : null;
      })
      .then(function(c){ if (c) return boot(c); showError(); });
  }

  // Новый день, пока приложение было свёрнуто
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || !cfg) return;
    var now = startOfDay(new Date());
    if (now.getTime() !== today.getTime()){
      today = now; calMonth = new Date(today.getFullYear(), today.getMonth(), 1); selKey = null;
      wasComplete = dayStats(getDay(todayKey())).complete;
    }
    render();
  });

  start();
})();
</script>
</body>
</html>
